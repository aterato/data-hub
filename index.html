<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="スマートフォンやPCで見つけたページを共有するURLメモ">
    <title>URLメモ | data-hub</title>
    <link rel="stylesheet" href="styles.css?v=url-memos-2">
    <script src="supabase-config.js?v=1" defer></script>
    <script src="script.js?v=url-memos-2" defer></script>
  </head>
  <body>
    <main class="card">
      <header class="page-header">
        <p class="eyebrow">DATA-HUB · SHARED BOOKMARKS</p>
        <h1>URLメモ</h1>
        <p class="intro">スマホで見つけたページをメモして、あとで PC からも見られる共有リストです。</p>
      </header>

      <section class="memo-composer" aria-labelledby="composer-title">
        <h2 id="composer-title">ページをメモする</h2>
        <form id="memo-form">
          <label for="memo-url">URL <span class="required">必須</span></label>
          <input id="memo-url" name="url" type="url" inputmode="url" placeholder="https://example.com/article" maxlength="2048" autocomplete="url" required>

          <label for="memo-title">タイトル <span class="optional">任意</span></label>
          <input id="memo-title" name="title" type="text" maxlength="200" placeholder="空欄の場合はドメイン名を使います">

          <label for="memo-note">メモ <span class="optional">任意</span></label>
          <textarea id="memo-note" name="note" rows="3" maxlength="3000" placeholder="あとで見たいポイントなど"></textarea>

          <label for="write-passphrase">書き込み用の合言葉</label>
          <input id="write-passphrase" name="passphrase" type="password" autocomplete="current-password" required>
          <p class="privacy-note">一覧は公開されています。URL やメモに個人情報・秘密情報を書かないでください。合言葉は書き込み時だけ送信され、このページには保存されません。</p>

          <div class="form-actions">
            <button id="submit-button" type="submit">リストに追加</button>
            <button id="cancel-edit" class="secondary-button" type="button" hidden>編集をやめる</button>
          </div>
        </form>
      </section>

      <section class="memo-list-section" aria-labelledby="list-title">
        <div class="list-heading">
          <h2 id="list-title">共有リスト</h2>
          <button id="refresh-button" class="text-button" type="button">更新</button>
        </div>
        <p id="app-status" class="status" role="status" aria-live="polite">リストを読み込んでいます…</p>
        <ul id="memo-list" class="memo-list"></ul>
      </section>

      <footer class="footer">スマホでも PC でも、同じリストを確認できます。</footer>
    </main>
  </body>
</html>
