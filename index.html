<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>mobile codex lab</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A SMALL SPACE FOR EXPERIMENTS</p>
      <h1>mobile codex lab</h1>
      <p class="intro">ひらめきを、ここから。<br>モバイルから始める小さな実験室。</p>
      <section class="clock" aria-labelledby="clock-label">
        <h2 id="clock-label">現在の日時</h2>
        <time id="datetime">日時を読み込んでいます…</time>
        <p id="timezone"></p>
        <noscript>日時を表示するには JavaScript を有効にしてください。</noscript>
      </section>
      <img class="landscape" src="photos/vineyard.jpg" alt="霧がかかった山並みと街を見渡す、緑豊かなぶどう畑" width="1280" height="1280">
      <p class="footer"><span aria-hidden="true">●</span> 少しずつ、試してみよう。</p>
    </main>
  </body>
</html>
